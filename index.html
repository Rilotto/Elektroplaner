<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Elektroplaner</title>
<meta name="theme-color" content="#F4F6F5">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#E4E9E8; --floor:#FBFCFB; --ink:#22282C; --muted:#5E6A6F; --wall:#2C3338;
  --grid:#CED6D4; --grid2:#B5C0BD; --accent:#1F5FBF; --accent-ink:#fff; --warn:#C8412F;
  --panel:#F4F6F5; --line:#D5DCDA; --field:#fff;
  --w-dark:#4A5459; --w-mid:#8A9599; --w-light:#C3CBCD; --del:#C8412F; --new:#2E8B57; --new-soft:#BFE0CC;
  --f:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --fc:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#171B1E; --floor:#252B2F; --ink:#E4E9E7; --muted:#98A4A8; --wall:#D3DAD7;
  --grid:#232A2E; --grid2:#30393E; --accent:#6E9FEF; --accent-ink:#0E1A2E; --warn:#EE6B58;
  --panel:#1D2225; --line:#30383C; --field:#161A1C;
  --w-dark:#AEB8BB; --w-mid:#7F8A8E; --w-light:#4E585C; --del:#EE6B58; --new:#5CC08A; --new-soft:#25473A;}}
:root[data-theme="dark"]{
  --paper:#171B1E; --floor:#252B2F; --ink:#E4E9E7; --muted:#98A4A8; --wall:#D3DAD7;
  --grid:#232A2E; --grid2:#30393E; --accent:#6E9FEF; --accent-ink:#0E1A2E; --warn:#EE6B58;
  --panel:#1D2225; --line:#30383C; --field:#161A1C;
  --w-dark:#AEB8BB; --w-mid:#7F8A8E; --w-light:#4E585C; --del:#EE6B58; --new:#5CC08A; --new-soft:#25473A;}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--panel);color:var(--ink);font:15px/1.4 var(--f);display:flex;flex-direction:column;overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
header{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line);overflow-x:auto;flex:0 0 auto}
.btn{min-height:40px;padding:0 12px;border:1px solid var(--line);background:var(--field);border-radius:8px;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn:disabled{opacity:.35;cursor:default}
.btn.icon{width:40px;padding:0;flex:0 0 auto}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.danger{color:var(--warn)}
.btn.warn{color:var(--warn);border-color:var(--warn);font-weight:600}
.catg{border-top:1px solid var(--line)}.catg>summary{min-height:44px;display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px;cursor:pointer;list-style:none}.catg>summary::-webkit-details-marker{display:none}.catg>summary::before{content:'▸';color:var(--muted);transition:transform .15s}.catg[open]>summary::before{transform:rotate(90deg)}.catg .cat{padding-bottom:10px}
.lgrp{border-top:1px solid var(--line);padding:6px 0}.lgrp>b{display:block;font-size:13px;color:var(--muted);font-weight:600;margin-bottom:2px}.lgrp summary{cursor:pointer;min-height:36px;display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted)}
.btn:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
select.btn{padding-right:8px;max-width:170px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:0 0 auto}
.seg button{min-height:40px;padding:0 13px;border:0;background:var(--field);white-space:nowrap}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel);font-weight:600}
.seg.full{display:flex;width:100%}.seg.full button{flex:1;padding:0 6px}
#info{font-family:var(--fc);font-size:15px;color:var(--muted);margin-left:auto;white-space:nowrap;padding:0 4px}
main{flex:1;display:flex;min-height:0}
#stage{flex:1;position:relative;background:var(--paper);min-width:0;overflow:hidden}
#svg{position:absolute;inset:0;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none}
#panel{width:340px;flex:0 0 auto;border-left:1px solid var(--line);overflow-y:auto;padding:14px 14px 24px}
@media (max-width:1000px){header{flex-wrap:wrap;overflow-x:visible}#info{order:9}}
@media (max-width:820px){main{flex-direction:column}#panel{width:auto;height:42%;border-left:0;border-top:1px solid var(--line)}}
#badge{position:absolute;left:10px;bottom:10px;display:flex;gap:6px;flex-wrap:wrap;max-width:calc(100% - 20px);pointer-events:none}
#badge span{min-height:30px;padding:4px 12px;border-radius:15px;border:1px solid var(--line);background:var(--floor);font-size:14px;display:inline-flex;align-items:center;gap:6px}
#badge i{width:12px;height:12px;border-radius:3px;display:inline-block}
#variants{position:absolute;left:10px;top:10px;display:flex;gap:6px;flex-wrap:wrap;max-width:calc(100% - 20px)}
#variants button{min-height:34px;padding:0 12px;border-radius:17px;border:1px solid var(--line);background:var(--floor);font-size:14px}
#variants span{display:inline-block}
#variants button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);font-weight:600}
.cat{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.cat .btn span{min-width:0;overflow-wrap:anywhere}
[hidden]{display:none!important}
.cat .btn{justify-content:flex-start;white-space:normal;text-align:left;line-height:1.15;padding:4px 8px;min-height:46px;font-size:14px;gap:8px}
.tabs{display:flex;margin:-14px -14px 14px;border-bottom:1px solid var(--line);position:sticky;top:-14px;background:var(--panel);z-index:2;overflow-x:auto}
.tabs button{flex:1 1 auto;min-height:46px;padding:0 5px;white-space:nowrap;font-size:13.5px!important;border:0;background:none;border-bottom:3px solid transparent;color:var(--muted);font-size:15px}
.tabs button[aria-selected="true"]{border-bottom-color:var(--accent);color:var(--ink);font-weight:600}
table.sum{border-collapse:collapse;width:100%;font-size:13.5px;font-variant-numeric:tabular-nums}
table.sum th,table.sum td{padding:6px 3px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
table.sum th:first-child,table.sum td:first-child{text-align:left;white-space:normal}
table.sum th{font-weight:600;color:var(--muted);font-size:13px}
table.sum tfoot td{font-weight:600;border-bottom:0}
table.kv td:last-child{font-family:var(--fc);font-size:15px}
.mlist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--field)}
.mrow{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:54px;padding:8px 14px;border:0;border-top:1px solid var(--line);background:var(--field);text-align:left;width:100%}
.mrow:first-child{border-top:0}
.mrow b{font-weight:500;display:block}
.mrow small{display:block;color:var(--muted);font-size:13px}
.mrow .chev{color:var(--muted);font-size:20px}
.mrow.danger b{color:var(--warn)}
.mrow:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
#board{position:absolute;inset:0;overflow:auto;padding:14px max(16px,env(safe-area-inset-left,0px)) 40px}
.bchips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.bchips button{min-height:34px;padding:0 12px;border-radius:17px;border:1px solid var(--line);background:var(--floor);font-size:14px}
.bchips button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);font-weight:600}
.bhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}.bhead h2{margin:0}
.bwrap{overflow-x:auto;background:var(--floor);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px}
.bempty{max-width:420px;margin:40px auto}
table.ci td{vertical-align:top;text-align:left}table.ci th{text-align:left}table.ci td:first-child{white-space:nowrap}table.ci td:nth-child(2),table.ci td:nth-child(7){white-space:normal;min-width:120px}table.ci tbody tr:hover{background:var(--panel)}
h2{font-size:17px;font-weight:600;margin:0 0 10px}
h3{font-size:14px;font-weight:600;margin:18px 0 8px;color:var(--muted)}
p.hint{color:var(--muted);margin:0 0 12px;font-size:14px}
.row{display:flex;gap:8px;align-items:end;margin-bottom:10px;flex-wrap:wrap}
.row.end{justify-content:flex-end}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);flex:1;min-width:0}
label.f input,label.f select{min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--field);padding:0 10px;width:100%;color:var(--ink);font-size:16px}
label.f input:disabled{opacity:.6}
label.chk{display:flex;align-items:center;gap:10px;min-height:40px;font-size:15px}
label.chk input{width:22px;height:22px;accent-color:var(--accent)}
.unit{position:relative}.unit::after{content:attr(data-u);position:absolute;right:10px;bottom:10px;font-size:13px;color:var(--muted);pointer-events:none}
.unit input{padding-right:34px!important}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.lst{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.lst li{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line)}
.lst .nm{flex:1;min-width:0}
.lst .nm b{display:block;font-weight:500;overflow-wrap:anywhere}
.lst .nm small{font-family:var(--fc);font-size:14px;color:var(--muted)}
.lst button.nm{border:0;background:none;text-align:left;padding:0;min-height:36px}
.chip{width:26px;height:18px;border-radius:3px;flex:0 0 auto;box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}
.tag{font-family:var(--fc);font-size:13px;padding:1px 7px;border-radius:10px;border:1px solid var(--line);color:var(--muted)}
.tag.on{border-color:var(--accent);color:var(--accent)}
.warnbox{border-left:3px solid var(--warn);padding:6px 10px;margin:0 0 12px;font-size:14px;color:var(--warn);background:color-mix(in srgb,var(--warn) 8%,transparent)}
.note{border-left:3px solid var(--line);padding:6px 10px;margin:0 0 12px;font-size:14px;color:var(--muted)}
#modal{position:fixed;inset:0;background:rgba(10,14,16,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
#modal.open{display:flex}
.sheet{background:var(--panel);border-radius:12px;padding:18px;width:min(460px,100%);max-height:92%;overflow:auto;box-shadow:0 12px 40px rgba(0,0,0,.3)}
.stack{display:flex;flex-direction:column;gap:8px}
.stack .btn{justify-content:flex-start}
#sync{position:relative}
#sync::after{content:'';position:absolute;right:6px;top:6px;width:9px;height:9px;border-radius:50%;background:var(--muted);box-shadow:0 0 0 2px var(--field)}
#sync[data-st=off]::after{display:none}
#sync[data-st=ok]::after{background:#2E8B57}
#sync[data-st=wait]::after,#sync[data-st=busy]::after{background:#D69E2E}
#sync[data-st=err]::after{background:var(--warn)}
.msg{font-size:14px;color:var(--warn);min-height:1.2em;margin:4px 0 0}
.sheet ol{padding-left:20px;margin:0 0 12px;font-size:14px;color:var(--muted)}
.sheet ol li{margin-bottom:4px}
.sheet a{color:var(--accent)}
.btn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--panel)}
#toolhint{position:absolute;left:50%;top:52px;transform:translateX(-50%);background:var(--ink);color:var(--panel);font-size:14px;padding:6px 12px;border-radius:16px;display:none;white-space:nowrap;max-width:calc(100% - 20px);overflow:hidden;text-overflow:ellipsis;pointer-events:none}
#toolhint.on{display:block}
#printArea{display:none}
@media print{
  @page{margin:12mm}
  html,body{height:auto!important;overflow:visible!important;display:block!important;background:#fff!important}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block}#printArea img{width:100%;height:auto}
}
/* svg */
.gl{stroke:var(--grid);stroke-width:1}
.gl.m{stroke:var(--grid2)}
.rf{fill:var(--floor)}
.wo{fill:none;stroke:var(--wall);stroke-width:1.3;stroke-linejoin:miter}
.wdel{fill:none;stroke:var(--del);stroke-width:1.8;stroke-dasharray:6 4}
.ul{fill:none;stroke:var(--muted);stroke-width:1;stroke-dasharray:5 4;opacity:.7}
.gap{fill:var(--floor)}
.jamb{stroke:var(--wall);stroke-width:1.3}
.dline{stroke:var(--wall);stroke-width:1.8;fill:none}
.darc{stroke:var(--wall);stroke-width:1;fill:none;stroke-dasharray:4 3}
.win{stroke:var(--wall);stroke-width:1.1}
.op-new .jamb,.op-new .dline,.op-new .darc,.op-new .win{stroke:var(--new)}
.op-del .jamb,.op-del .dline,.op-del .darc,.op-del .win{stroke:var(--del)}
.rl{fill:var(--ink);font-family:var(--f);pointer-events:none}
.rl.a{fill:var(--muted);font-family:var(--fc)}
.rlb{fill:var(--floor);opacity:.85}
.rlsel{fill:none;stroke:var(--accent);stroke-width:2;stroke-dasharray:7 5}
.wsel{fill:none;stroke:var(--accent);stroke-width:3}
.opsel{stroke:var(--accent);stroke-width:5;stroke-opacity:.55}
.vtx{fill:var(--floor);stroke:var(--ink);stroke-width:1.6}
.vtx.on{fill:var(--accent);stroke:var(--accent)}
.hit{stroke:transparent;stroke-width:26;fill:none}
.nhit{fill:transparent}
.dim{stroke:var(--accent);stroke-width:1.2}
.dimt{fill:var(--accent);font-family:var(--fc);font-weight:600}
.wl{fill:var(--muted);font-family:var(--fc);font-weight:500}
.wl.on{fill:var(--accent)}
.dimbg{fill:var(--paper);opacity:.9}
.sy *{vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round}
.sy text{stroke:none}
.dim,.dimt,.dimbg,.wl,.wsel,.rlsel,.opsel,.vtx,.wo,.wdel,.ul,.gap,.jamb,.win,.dline,.darc,.prev,.meas,.measend{pointer-events:none}
.prev{fill:var(--accent);fill-opacity:.22;stroke:var(--accent);stroke-width:1.5;stroke-dasharray:6 4}
.pcur{fill:none;stroke:var(--accent);stroke-width:2}
.meas{stroke:var(--accent);stroke-width:2.5;stroke-dasharray:8 5}
.measend{fill:var(--accent);stroke:var(--floor);stroke-width:2}
</style>
</head>
<body>
<header>
  <button class="btn" id="projBtn" style="max-width:170px;overflow:hidden;text-overflow:ellipsis">Projekt</button>
  <select id="floorSel" class="btn" aria-label="Etage wählen"></select>
  <button class="btn" id="floorMenu">Etagen</button>
  <div class="seg" role="group" aria-label="Ansicht" id="viewSeg">
    <button data-view="ist">Ist</button><button data-view="soll">Soll</button><button data-view="umbau">Umbau</button>
  </div>
  <div class="seg" role="group" aria-label="Ebene" id="modeSeg">
    <button data-mode="plan">Grundriss</button><button data-mode="elec">Elektro</button><button data-mode="dist">Verteiler</button>
  </div>
  <div class="seg" role="group" aria-label="Werkzeug" id="toolSeg">
    <button data-tool="sel">Auswählen</button><button data-tool="draw">Wand zeichnen</button>
  </div>
  <button class="btn icon" id="undo" aria-label="Rückgängig"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
  <button class="btn icon" id="redo" aria-label="Wiederholen"><svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
  <button class="btn icon" id="meas" aria-label="Maßband" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M3 15 15 3l6 6L9 21z"/><path d="m7 11 2 2M10 8l2 2M13 5l2 2"/></svg></button>
  <button class="btn icon" id="fit" aria-label="Plan einpassen"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  <button class="btn" id="probs" aria-label="Hinweise">✓</button>
  <span id="info"></span>
  <button class="btn icon" id="sync" data-st="off" aria-label="Speicherort"><svg viewBox="0 0 24 24"><path d="M7 18a4.5 4.5 0 0 1-.6-8.96A6 6 0 0 1 18 9.5a4.25 4.25 0 0 1-.5 8.5z"/></svg></button>
  <button class="btn icon" id="menu" aria-label="Einstellungen und Daten"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
</header>
<main>
  <div id="stage">
    <svg id="svg"><g id="world"></g></svg>
    <div id="badge"></div>
    <div id="variants"></div>
    <div id="board" hidden></div>
    <div id="toolhint"></div>
  </div>
  <aside id="panel"></aside>
</main>
<div id="modal" role="dialog" aria-modal="true"></div>
<div id="printArea"></div>
<input type="file" id="fileIn" accept=".json,application/json" hidden>

<script>
(()=>{
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KEY='elektroplaner.v1',IDX='elektroplaner.projects',PKEY=id=>'elektroplaner.p.'+id;
const APP_VERSION='0.7.0',REPO_URL='https://github.com/Rilotto/Elektroplaner';
const CHANGELOG=[
 ['0.7.0','Mehrere Projekte (Häuser) anlegen und wechseln, Versionsanzeige mit Änderungen, Fenster und Türen duplizieren, Innenwände der Unterlage ausblendbar, Räume und Art je Stromkreis, FI-Verteilungsprüfung, Andocken neuer Räume, Leitungswege entlang der Wände und durch Türen, Kabeldurchlass, Bündelung, Treppen'],
 ['0.6.2','Kombination Schalter + Steckdose hintereinander dargestellt'],
 ['0.6.1','Hinweis-Anzeige im Kopf, Klingeltrafo automatisch, Kombination Schalter + Steckdose, Fluchtlinien für Deckenleuchten, Klingel- und Netzwerkkabel im Plan, „Schaltet“-Liste nach Räumen'],
 ['0.6','Pläne und Listen ausgeben: Installationsplan mit Plankopf, PDF, PNG, alle Listen als CSV'],
 ['0.5','Datenverteiler mit Patchpanel und Port-Belegung, Klingelanlage, Eltako-Aktoren mit Schaltbild, Außen-Hinweise'],
 ['0.4','Leitungswege und Längen je Stromkreis, Installationszonen, Materialliste'],
 ['0.3','Stromkreise, Verteiler-Ansicht mit Reihen und TE, Zuleitungen, Stromkreisliste'],
 ['0.2.1','Reiter, neues Menü, schaltbare Steckdosen, Wechsel- und Kreuzschaltungen, Schaltbild'],
 ['0.2','Elektro-Ebene mit Schaltzeichen, Höhen, Montageart, Legende, Varianten'],
 ['0.1','Grundriss und Etagen: Wände mit Dicke und Bauart, Räume, Türen und Fenster, Ist/Soll/Umbau']];
const IN_ART=/claude\.ai|claudeusercontent/.test(location.host);
const round=(v,g)=>Math.round(v/g)*g;
const r1=v=>Math.round(v*10)/10;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const fmt=v=>String(r1(v)).replace('.',',');
const fmtA=v=>v.toFixed(1).replace('.',',');
const num=v=>parseFloat(String(v).replace(',','.'));

/* ---------- Daten ---------- */
const ST={keep:'Bestand bleibt',del:'Bestand entfällt',new:'Neu'};
const VIEWS={ist:'Ist-Aufnahme',soll:'Soll-Plan',umbau:'Umbauplan'};
const VIS={ist:x=>x.st!=='new',soll:x=>x.st!=='del',umbau:()=>true};
const SHADES={dark:'Dunkel',mid:'Mittel',light:'Hell',hatch:'Schraffiert'};
const OPT={door:'Tür',window:'Fenster',pass:'Durchgang'};
/* ---------- Elektro: Elementarten und Schaltzeichen ---------- */
const HCLS={switch:'Schalter und Taster',socket:'Steckdosen',work:'Über Arbeitsplatte',net:'Netzwerkdosen',wlight:'Wandleuchten und Melder',bell:'Klingel und Sprechanlage',dist:'Verteiler (Unterkante)',other:'Sonstige Anschlüsse'};
const DEF_H={switch:105,socket:30,work:115,net:30,wlight:200,bell:140,dist:110,other:30};
const MOUNT={UP:'Unterputz',HW:'Hohlwand',AP:'Aufputz',IP44:'Außen IP44',IP65:'Außen IP65'};

function idxTouch(){const L=idx(),e=L.find(x=>x.id===S.pid);if(e){e.name=pName(S);e.t=Date.now()}else L.push({id:S.pid,name:pName(S),t:Date.now()});idxSave(L)}
function stashActive(){try{localStorage.setItem(PKEY(S.pid),hist[hp]);localStorage.setItem(PKEY(S.pid)+'.t',String(localTs()||Date.now()))}catch(e){}idxTouch()}
function activate(s,ts){S=upgrade(s);hist=[JSON.stringify(S)];hp=0;try{localStorage.setItem(KEY,hist[0]);localStorage.setItem(KEY+'.t',String(ts||Date.now()))}catch(e){}
  idxTouch();UI.sel=null;UI.chain=null;UI.selC=null;UI.selB=null;UI.assign=null;UI.place=null;UI.dv=null;SY.sha=null;renderAll();fit();if(sync)syncNow()}
function switchProject(id){if(id===S.pid)return;stashActive();let s=null,ts=0;try{s=JSON.parse(localStorage.getItem(PKEY(id)));ts=+localStorage.getItem(PKEY(id)+'.t')||0}catch(e){}
  if(!s||!valid(s)){flash('Projekt konnte nicht geladen werden.');return}activate(s,ts);flash(`Projekt „${pName(S)}“ geöffnet.`)}
function newProject(name,copy){stashActive();const s=copy?JSON.parse(hist[hp]):defaultState();s.pid=uid();s.project={...(copy?s.project:{name:'',address:'',author:'',stand:''}),name};activate(s,Date.now());flash(`Projekt „${name}“ angelegt.`)}
function deleteProject(id){const L=idx().filter(x=>x.id!==id);idxSave(L);try{localStorage.removeItem(PKEY(id));localStorage.removeItem(PKEY(id)+'.t')}catch(e){}}
function projectsMenu(){stashActive();const L=idx().sort((a,b)=>a.name.localeCompare(b.name,'de'));const {el,close}=modal(`<h2>Projekte</h2><p class="hint">Jedes Projekt ist ein eigenes Haus mit Etagen, Stromkreisen und Verteilern.</p>
  <div class="mlist">${L.map(p=>`<button class="mrow" data-po="${p.id}"><span><b>${esc(p.name)}${p.id===S.pid?' <span class="tag on">geöffnet</span>':''}</b><small>zuletzt geändert ${new Date(p.t).toLocaleString('de-DE')}</small></span><span class="chev" aria-hidden="true">›</span></button>`).join('')}</div>
  <div class="row" style="margin-top:12px"><label class="f">Neues Projekt<input id="pnn" placeholder="z. B. Haus Musterstraße 3"></label></div>
  <div class="stack"><button class="btn primary" id="pnew">Leeres Projekt anlegen</button><button class="btn" id="pdup">Geöffnetes Projekt als Kopie anlegen</button>${sync&&!IN_ART?'<button class="btn" id="pgh">Projekte aus GitHub laden</button>':''}<button class="btn danger" id="pdel" ${L.length<2?'disabled':''}>Geöffnetes Projekt löschen</button></div>
  <p class="hint" style="margin-top:10px">Umbenennen über Menü → Projekt und Plankopf. Gelöschte Projekte bleiben im GitHub-Daten-Repo erhalten.</p>`);
  el.querySelectorAll('[data-po]').forEach(b=>b.onclick=()=>{close();switchProject(b.dataset.po)});
  const nm=()=>el.querySelector('#pnn').value.trim();
  el.querySelector('#pnew').onclick=()=>{const n=nm();if(!n){el.querySelector('#pnn').focus();return}close();newProject(n,false)};
  el.querySelector('#pdup').onclick=()=>{close();newProject(nm()||pName(S)+' (Kopie)',true)};
  el.querySelector('#pgh')?.addEventListener('click',()=>{close();ghProjects()});
  el.querySelector('#pdel').onclick=()=>{if(L.length<2)return;close();confirmBox(`„${pName(S)}“ von diesem Gerät löschen?`,'Löschen',()=>{const old=S.pid,next=idx().find(x=>x.id!==old);deleteProject(old);let s=null;try{s=JSON.parse(localStorage.getItem(PKEY(next.id)))}catch(e){}if(s)activate(s,next.t)})}}
async function ghProjects(){try{const r=await fetch(`https://api.github.com/repos/${sync.repo}/contents/projekte`,{cache:'no-store',headers:{Authorization:'Bearer '+sync.token,Accept:'application/vnd.github+json'}});
  if(r.status===404){flash('Im Daten-Repo liegen noch keine Projekte.');return}if(!r.ok)throw r.status;const files=(await r.json()).filter(x=>/\.json$/.test(x.name)),have=new Set(idx().map(x=>x.id));
  const {el,close}=modal(`<h2>Projekte in GitHub</h2><div class="mlist">${files.map(x=>{const id=x.name.replace(/\.json$/,'');return `<button class="mrow" data-gp="${esc(x.path)}" ${have.has(id)?'disabled':''}><span><b>${esc(id)}</b><small>${have.has(id)?'schon auf diesem Gerät':'Antippen lädt das Projekt'}</small></span><span class="chev">›</span></button>`}).join('')||'<p class="hint">Keine Projekte gefunden.</p>'}</div>`);
  el.querySelectorAll('[data-gp]').forEach(b=>b.onclick=async()=>{close();try{const g=await fetch(`https://api.github.com/repos/${sync.repo}/contents/${b.dataset.gp}`,{cache:'no-store',headers:{Authorization:'Bearer '+sync.token,Accept:'application/vnd.github+json'}});if(!g.ok)throw g.status;
    const s=JSON.parse(b64d((await g.json()).content));if(!valid(s))throw 0;const t=s.updatedAt||Date.now();delete s.updatedAt;stashActive();activate(s,t);flash(`Projekt „${pName(S)}“ aus GitHub geladen.`)}catch(e){flash('Laden fehlgeschlagen: '+syncErr(e))}})}catch(e){flash(syncErr(e))}}
function versionMenu(){modal(`<h2>Elektroplaner ${APP_VERSION}</h2><p class="hint">Du nutzt gerade Version <b>${APP_VERSION}</b>. Alle Änderungen im Detail stehen in der <a href="${REPO_URL}/commits/main" target="_blank" rel="noopener">Versionsgeschichte auf GitHub</a>.</p>
  <div class="mlist">${CHANGELOG.map(([v,t])=>`<div class="mrow" style="cursor:default"><span><b>Version ${v}${v===APP_VERSION?' <span class="tag on">aktuell</span>':''}</b><small>${esc(t)}</small></span></div>`).join('')}</div>`)}

let S=load()||defaultState();if(!S.pid)S.pid=uid();
let hist=[JSON.stringify(S)],hp=0;
const UI={tab:{plan:'edit',elec:'edit',dist:'bel'},dv:null,selB:null,selC:null,assign:null,grp:null,mode:'plan',place:null,flash:null,view:'ist',tool:'sel',sel:null,vp:{s:1,tx:0,ty:0},chain:null,cur:null,meas:null,measOn:false,draw:null};

const floor=()=>S.floors.find(f=>f.id===S.activeFloor)||S.floors[0];
const types=()=>S.settings.wallTypes;
const typeOf=w=>types().find(t=>t.id===w.type)||types()[0];
const buildOf=w=>typeOf(w).builds.find(b=>b.name===w.build);
const nodeOf=(f,id)=>f.nodes.find(n=>n.id===id);
const newStatus=()=>UI.view==='ist'?'keep':'new';
function drawDefaults(){if(!UI.draw||!types().some(t=>t.id===UI.draw.type)){const t=types()[0];UI.draw={type:t.id,build:t.builds[0]?.name||'',t:t.t}}return UI.draw}

function save(){try{localStorage.setItem(KEY,hist[hp]);localStorage.setItem(KEY+'.t',String(Date.now()))}catch(e){}idxTouch();schedulePush()}
function commit(){normalize(floor());const j=JSON.stringify(S);if(j===hist[hp])return;hist=hist.slice(0,hp+1);hist.push(j);if(hist.length>150)hist.shift();hp=hist.length-1;save();updBar()}
function restore(){S=JSON.parse(hist[hp]);validateSel();if(UI.chain&&!nodeOf(floor(),UI.chain.last))UI.chain=null;save();renderAll()}
function undo(){if(hp>0){hp--;restore()}}
function redo(){if(hp<hist.length-1){hp++;restore()}}

/* ---------- GitHub-Sync ---------- */
const SYNC_KEY='elektroplaner.sync',DEFAULT_REPO='Rilotto/Elektroplaner-daten',DATA_PATH='daten.json';
let sync=(()=>{try{const c=JSON.parse(localStorage.getItem(SYNC_KEY));return c&&c.repo&&c.token?c:null}catch(e){return null}})();
const SY={sha:null,timer:null,busy:false,dirty:false,state:'off',msg:'Nur auf diesem Gerät gespeichert'};
const localTs=()=>{try{return +localStorage.getItem(KEY+'.t')||0}catch(e){return 0}};
function setSync(st,msg){SY.state=st;SY.msg=msg;const b=$('#sync');if(b){b.dataset.st=st;b.title=msg;b.setAttribute('aria-label','Speicherort: '+msg)}}
const b64e=str=>{const b=new TextEncoder().encode(str);let r='';for(let i=0;i<b.length;i+=0x8000)r+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(r)};
const b64d=str=>new TextDecoder().decode(Uint8Array.from(atob(str.replace(/\s/g,'')),c=>c.charCodeAt(0)));
function gh(method,body,cfg=sync){return fetch(`https://api.github.com/repos/${cfg.repo}/contents/projekte/${S.pid}.json`,{method,cache:'no-store',
  headers:{Authorization:'Bearer '+cfg.token,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'},body:body?JSON.stringify(body):undefined})}
async function pull(cfg=sync){const r=await gh('GET',null,cfg);if(r.status===404)return null;if(!r.ok)throw r.status;const j=await r.json();SY.sha=j.sha;return JSON.parse(b64d(j.content))}
function syncErr(e){return e===401?'Token ungültig oder abgelaufen':e===403?'Token hat keinen Zugriff auf das Repo':e===404?'Repo nicht gefunden':'Keine Verbindung, Änderungen bleiben auf dem Gerät'}
function payload(){const o=JSON.parse(hist[hp]);o.updatedAt=localTs()||Date.now();return JSON.stringify(o)}
async function push(){if(!sync)return;if(SY.busy){SY.dirty=true;return}clearTimeout(SY.timer);SY.timer=null;SY.busy=true;SY.dirty=false;setSync('busy','Speichert in GitHub …');
  try{const body={message:'Elektroplaner '+new Date().toLocaleString('de-DE'),content:b64e(payload())};if(SY.sha)body.sha=SY.sha;
    let r=await gh('PUT',body);
    if(r.status===409||r.status===422){const g=await gh('GET');if(g.ok){SY.sha=(await g.json()).sha;body.sha=SY.sha;r=await gh('PUT',body)}}
    if(!r.ok)throw r.status;SY.sha=(await r.json()).content.sha;setSync('ok','In GitHub gespeichert')}
  catch(e){setSync('err',syncErr(e))}
  finally{SY.busy=false;if(SY.dirty)schedulePush()}}
function schedulePush(){if(!sync)return;clearTimeout(SY.timer);setSync('wait','Änderungen werden gleich gespeichert');SY.timer=setTimeout(push,2500)}
function adopt(remote){const t=remote.updatedAt||Date.now();delete remote.updatedAt;S=upgrade(remote);
  hist=[JSON.stringify(S)];hp=0;try{localStorage.setItem(KEY,hist[0]);localStorage.setItem(KEY+'.t',String(t))}catch(e){}UI.sel=null;UI.chain=null;renderAll();fit()}
async function syncNow(){if(!sync||SY.busy||SY.timer)return;setSync('busy','Lädt aus GitHub …');
  try{const remote=await pull(),rt=remote?.updatedAt||0,lt=localTs();
    if(remote&&valid(remote)&&rt>lt){adopt(remote);setSync('ok','Neuester Stand aus GitHub geladen')}
    else if(!remote||lt>rt)await push();else setSync('ok','In GitHub gespeichert')}
  catch(e){setSync('err',syncErr(e))}}
function saveCfg(){try{sync?localStorage.setItem(SYNC_KEY,JSON.stringify(sync)):localStorage.removeItem(SYNC_KEY)}catch(e){}}
function syncMenu(){
  if(sync){const {el,close}=modal(`<h2>GitHub-Sync</h2><p class="hint">Verbunden mit <b>${esc(sync.repo)}</b>.<br>${esc(SY.msg)}</p>
    <div class="stack"><button class="btn" id="snow">Jetzt abgleichen</button><button class="btn danger" id="soff">Trennen</button></div>
    <p class="hint" style="margin-top:12px">Trennen entfernt den Zugangsschlüssel von diesem Gerät. Deine Pläne bleiben hier und in GitHub erhalten.</p>`);
    el.querySelector('#snow').onclick=()=>{close();syncNow()};
    el.querySelector('#soff').onclick=()=>{close();sync=null;SY.sha=null;saveCfg();setSync('off','Nur auf diesem Gerät gespeichert')};return}
  const ref=modal(`<h2>Mit GitHub verbinden</h2>
    <p class="hint">Dann landen deine Pläne automatisch in deinem privaten Daten-Repo und sind auf jedem Gerät gleich. Das richtest du pro Gerät einmal ein. Der Raumplaner-Token bleibt davon unberührt.</p>
    <ol><li><a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">Neuen Token auf GitHub erstellen</a></li>
    <li>Bei „Repository access“ nur <b>Elektroplaner-daten</b> auswählen</li><li>Bei „Permissions“ → „Contents“ auf „Read and write“ stellen</li><li>Token kopieren und hier einfügen</li></ol>
    <div class="row"><label class="f">Daten-Repo<input id="srepo" value="${esc(DEFAULT_REPO)}" autocapitalize="off" spellcheck="false"></label></div>
    <div class="row"><label class="f">Token<input id="stok" type="password" autocomplete="off" placeholder="github_pat_…"></label></div><p class="msg" id="smsg"></p>`,m=>{
    const cfg={repo:m.querySelector('#srepo').value.trim().replace(/^https?:\/\/github\.com\//,'').replace(/\/$/,''),token:m.querySelector('#stok').value.trim()},msg=m.querySelector('#smsg'),btn=m.querySelector('[data-m=ok]');
    if(!/^[\w.-]+\/[\w.-]+$/.test(cfg.repo)){msg.textContent='Repo bitte als benutzername/repo-name eingeben';return false}
    if(!cfg.token){msg.textContent='Bitte den Token einfügen';return false}
    btn.disabled=true;msg.textContent='';btn.textContent='Verbindet …';
    connect(cfg).then(ok=>{if(ok)ref.close();else{btn.disabled=false;btn.textContent='Verbinden'}},e=>{msg.textContent=syncErr(e);btn.disabled=false;btn.textContent='Verbinden'});return false},'Verbinden')}
async function connect(cfg){SY.sha=null;const remote=await pull(cfg);sync=cfg;saveCfg();
  if(remote&&valid(remote)&&localTs()){
    const when=remote.updatedAt?new Date(remote.updatedAt).toLocaleString('de-DE'):'unbekannt';
    setTimeout(()=>{const {el,close}=modal(`<h2>In GitHub liegt schon ein Stand</h2><p class="hint">Gespeichert am ${esc(when)}. Welchen Stand möchtest du behalten? Der andere bleibt in der GitHub-Versionsgeschichte erhalten.</p>
      <div class="stack"><button class="btn primary" id="cg">Stand aus GitHub laden</button><button class="btn" id="cl">Stand von diesem Gerät hochladen</button></div>`);
      el.querySelector('#cg').onclick=()=>{close();adopt(remote);setSync('ok','Stand aus GitHub geladen')};
      el.querySelector('#cl').onclick=()=>{close();push()}},0)}
  else if(remote&&valid(remote)){adopt(remote);setSync('ok','Stand aus GitHub geladen')}
  else await push();
  return true}

/* ---------- Geometrie ---------- */
function inside(pt,pts){let c=false;for(let i=0,j=pts.length-1;i<pts.length;j=i++){const a=pts[i],b=pts[j];if((a.y>pt.y)!==(b.y>pt.y)&&pt.x<(b.x-a.x)*(pt.y-a.y)/(b.y-a.y)+a.x)c=!c}return c}
function sArea(p){let s=0;for(let i=0;i<p.length;i++){const a=p[i],b=p[(i+1)%p.length];s+=a.x*b.y-b.x*a.y}return s/2}
function bbox(pts){let a={minX:Infinity,minY:Infinity,maxX:-Infinity,maxY:-Infinity};for(const p of pts){a.minX=Math.min(a.minX,p.x);a.maxX=Math.max(a.maxX,p.x);a.minY=Math.min(a.minY,p.y);a.maxY=Math.max(a.maxY,p.y)}return a}
function centroid(P){let a=0,x=0,y=0;for(let i=0;i<P.length;i++){const p=P[i],q=P[(i+1)%P.length],c=p.x*q.y-q.x*p.y;a+=c;x+=(p.x+q.x)*c;y+=(p.y+q.y)*c}
  if(Math.abs(a)<1e-6){const b=bbox(P);return {x:(b.minX+b.maxX)/2,y:(b.minY+b.maxY)/2}}return {x:x/(3*a),y:y/(3*a)}}
function interiorPoint(P){const c=centroid(P);if(inside(c,P))return c;const bb=bbox(P);let best=null;
  for(const fr of [.5,.35,.65,.2,.8]){const y=bb.minY+(bb.maxY-bb.minY)*fr,xs=[];for(let i=0,j=P.length-1;i<P.length;j=i++){const a=P[i],b=P[j];if((a.y>y)!==(b.y>y))xs.push(a.x+(y-a.y)*(b.x-a.x)/(b.y-a.y))}
    xs.sort((a,b)=>a-b);for(let k=0;k+1<xs.length;k+=2){const w=xs[k+1]-xs[k];if(!best||w>best.w)best={w,x:(xs[k]+xs[k+1])/2,y}}}return best?{x:best.x,y:best.y}:c}
const last=a=>a[a.length-1];

/* Baut aus Knoten und Wänden die Wandkörper mit sauberen Stößen und erkennt die Räume (Flächen des Graphen). */
function G(f,view){
  const N=new Map(f.nodes.map(n=>[n.id,n])),vis=VIS[view],adj=new Map(),walls=[],byId=new Map();
  for(const w of f.walls){if(!vis(w))continue;const A=N.get(w.a),B=N.get(w.b);if(!A||!B||w.a===w.b)continue;
    const dx=B.x-A.x,dy=B.y-A.y,L=Math.hypot(dx,dy);if(L<0.05)continue;const u={x:dx/L,y:dy/L},g={w,A,B,L,u,n:{x:-u.y,y:u.x},h:Math.max(0.5,w.t/2)};
    walls.push(g);byId.set(w.id,g);
    if(!adj.has(w.a))adj.set(w.a,[]);if(!adj.has(w.b))adj.set(w.b,[]);
    adj.get(w.a).push({g,d:u,end:'a',o:w.b});adj.get(w.b).push({g,d:{x:-u.x,y:-u.y},end:'b',o:w.a})}
  const WG=new Map(),joints=[];
  for(const [id,L] of adj){const P=N.get(id);L.forEach(e=>e.ang=Math.atan2(e.d.y,e.d.x));L.sort((a,b)=>a.ang-b.ang);L.forEach((e,k)=>{e.k=k;e.g['e'+e.end]=e});
    const m=L.length,W=[];
    for(let k=0;k<m;k++){const i=L[k],j=L[(k+1)%m],ni={x:-i.d.y,y:i.d.x},nj={x:-j.d.y,y:j.d.x},hi=i.g.h,hj=j.g.h;
      const p1={x:P.x+ni.x*hi,y:P.y+ni.y*hi},p2={x:P.x-nj.x*hj,y:P.y-nj.y*hj};
      if(m===1){W.push([p1,p2]);continue}
      const cr=i.d.x*j.d.y-i.d.y*j.d.x;
      if(Math.abs(cr)<1e-6){W.push(dist(p1,p2)<0.05?[p1]:[p1,p2]);continue}
      const t=((p2.x-p1.x)*j.d.y-(p2.y-p1.y)*j.d.x)/cr,c={x:p1.x+i.d.x*t,y:p1.y+i.d.y*t};
      W.push(dist(c,P)>Math.max(hi,hj)*4+1?[p1,p2]:[c])}
    WG.set(id,{L,W});if(m>1)joints.push({poly:W.flat(),w:L.reduce((a,e)=>e.g.h>a.g.h?e:a).g.w})}
  for(const g of walls){const A=WG.get(g.w.a),B=WG.get(g.w.b),ka=g.ea.k,kb=g.eb.k,ma=A.L.length,mb=B.L.length;
    const aP=A.W[ka][0],aM=last(A.W[(ka-1+ma)%ma]),bP=B.W[kb][0],bM=last(B.W[(kb-1+mb)%mb]);
    g.poly=[g.A,aP,bM,g.B,bP,aM];g.sP=[aP,bM];g.sM=[aM,bP];g.lP=dist(aP,bM);g.lM=dist(aM,bP)}
  // Flächen: jede Halbkante hat ihre Fläche links
  const faces=[],seen=new Set(),heFace=new Map();
  for(const [id,{L}] of WG)for(const e of L){const key=e.g.w.id+':'+e.end;if(seen.has(key))continue;
    const hes=[],poly=[],npts=[];let cur=e,cid=id,guard=0;
    while(guard++<100000){const k=cur.g.w.id+':'+cur.end;if(seen.has(k))break;seen.add(k);hes.push(cur);npts.push(N.get(cid));
      const nid=cur.o,R=WG.get(nid),r=cur.end==='a'?cur.g.eb:cur.g.ea,idx=(r.k-1+R.L.length)%R.L.length;
      poly.push(...R.W[idx].slice().reverse());cur=R.L[idx];cid=nid}
    const na=sArea(npts),F={hes,poly,bounded:na>1,area:Math.abs(sArea(poly))};faces.push(F);for(const h of hes)heFace.set(h.g.w.id+':'+h.end,F)}
  return {N,walls,byId,adj,faces,heFace,joints,rooms:faces.filter(F=>F.bounded)}}
function faceAt(g,p){let best=null;for(const F of g.rooms)if(inside(p,F.poly)&&(!best||F.area<best.area))best=F;return best}
const wlen=(f,w)=>{const a=nodeOf(f,w.a),b=nodeOf(f,w.b);return a&&b?Math.hypot(b.x-a.x,b.y-a.y):0};
const deg=(f,id)=>f.walls.reduce((s,w)=>s+(w.a===id)+(w.b===id),0);

/* ---------- Grundriss bearbeiten ---------- */
function addNode(f,p){const n={id:uid(),x:r1(p.x),y:r1(p.y)};f.nodes.push(n);return n.id}
function splitWall(f,w,t){const A=nodeOf(f,w.a),B=nodeOf(f,w.b),L=wlen(f,w);t=clamp(t,0.5,L-0.5);
  const id=addNode(f,{x:A.x+(B.x-A.x)*t/L,y:A.y+(B.y-A.y)*t/L}),w2={...w,id:uid(),a:id,b:w.b};w.b=id;f.walls.push(w2);
  for(const o of f.openings)if(o.wall===w.id&&o.off+o.w/2>t){o.wall=w2.id;o.off-=t}return id}
function addWall(f,ia,ib,props){if(ia===ib)return 0;const A=nodeOf(f,ia),B=nodeOf(f,ib),dx=B.x-A.x,dy=B.y-A.y,L=Math.hypot(dx,dy);if(L<1)return 0;
  const cuts=[];
  for(const n of f.nodes){if(n.id===ia||n.id===ib||!deg(f,n.id))continue;const s=((n.x-A.x)*dx+(n.y-A.y)*dy)/L/L;if(s<=0.001||s>=0.999)continue;
    if(Math.hypot(n.x-(A.x+dx*s),n.y-(A.y+dy*s))<0.6)cuts.push({s,id:n.id})}

function snapDraw(w){const f=floor(),g=G(f,UI.view),thr=14/UI.vp.s,ch=UI.chain,a=ch&&nodeOf(f,ch.last);
  let best=null,bd=thr;for(const n of visNodes(f,g).concat(a&&!g.adj.has(a.id)?[a]:[])){const d=dist(n,w);if(d<bd){bd=d;best=n}}
  if(best)return {x:best.x,y:best.y,node:best.id};
  let bw=null;for(const x of g.walls){const t=(w.x-x.A.x)*x.u.x+(w.y-x.A.y)*x.u.y;if(t<thr||t>x.L-thr)continue;const q={x:x.A.x+x.u.x*t,y:x.A.y+x.u.y*t},d=dist(q,w);
    if(d<=Math.max(thr,x.h)&&(!bw||d<bw.d))bw={d,x:q.x,y:q.y,wall:x.w.id,t}}
  if(bw)return {x:bw.x,y:bw.y,wall:bw.wall,t:bw.t};
  const gr=S.settings.snap?S.settings.grid:0,p={x:w.x,y:w.y};
  if(a){const dx=p.x-a.x,dy=p.y-a.y,L=Math.hypot(dx,dy),ang=Math.atan2(dy,dx)*180/Math.PI,q=((ang%90)+90)%90,dev=Math.min(q,90-q);
    if(dev<8&&L>0){const ax=Math.abs(dx)>=Math.abs(dy);let len=ax?Math.abs(dx):Math.abs(dy);if(gr)len=round(len,gr);
      if(ax){p.x=a.x+Math.sign(dx)*len;p.y=a.y}else{p.y=a.y+Math.sign(dy)*len;p.x=a.x}
      for(const n of visNodes(f,g)){if(ax&&Math.abs(n.x-w.x)<thr)p.x=n.x;if(!ax&&Math.abs(n.y-w.y)<thr)p.y=n.y}
      return p}}
  if(gr){p.x=round(p.x,gr);p.y=round(p.y,gr)}
  for(const n of visNodes(f,g)){if(Math.abs(n.x-w.x)<thr)p.x=n.x;if(Math.abs(n.y-w.y)<thr)p.y=n.y}
  return p}
function resolve(f,c){if(c.node&&nodeOf(f,c.node))return {id:c.node,old:true};if(c.wall){const w=f.walls.find(x=>x.id===c.wall);if(w)return {id:splitWall(f,w,c.t),old:true}}return {id:addNode(f,c),old:false}}
function drawTo(c){const f=floor(),ch=UI.chain;
  if(!ch){const r=resolve(f,c);UI.chain={start:r.id,last:r.id,n:0};UI.cur=null;commit();renderPanel();render();return}
  if(c.node===ch.last){endChain();return}
  const r=resolve(f,c),made=addWall(f,ch.last,r.id,wallProps());ch.n+=made;ch.last=r.id;UI.cur=null;
  if(r.old&&ch.n>0){UI.chain=null}commit();renderPanel();render()}

function measSnap(p,a){const f=floor(),g=G(f,UI.view),thr=12/UI.vp.s;let best=null,bd=thr;
  const cand=[...visNodes(f,g)];for(const x of g.walls)cand.push(...x.poly);
  for(const c of cand){const d=dist(c,p);if(d<bd){bd=d;best=c}}
  if(best)return {x:best.x,y:best.y};const q={x:Math.round(p.x),y:Math.round(p.y)};
  if(a){if(Math.abs(q.x-a.x)<thr)q.x=a.x;if(Math.abs(q.y-a.y)<thr)q.y=a.y}return q}

function pinchStart(){const [a,b]=[...ptrs.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y)||1,s0:UI.vp.s,w:toWorld((a.x+b.x)/2,(a.y+b.y)/2)}}
function snapNode(p,id){const f=floor(),g=G(f,UI.view),gr=S.settings.grid,thr=14/UI.vp.s;if(S.settings.snap&&gr){p.x=round(p.x,gr);p.y=round(p.y,gr)}
  const nb=f.walls.filter(w=>w.a===id||w.b===id).map(w=>nodeOf(f,w.a===id?w.b:w.a));for(const q of nb){if(Math.abs(p.x-q.x)<thr)p.x=q.x;if(Math.abs(p.y-q.y)<thr)p.y=q.y}
  for(const q of visNodes(f,g))if(q.id!==id&&dist(q,p)<thr){p.x=q.x;p.y=q.y}}
function dropNode(id){const f=floor(),g=G(f,UI.view),p=nodeOf(f,id),thr=14/UI.vp.s;
  const q=visNodes(f,g).find(n=>n.id!==id&&dist(n,p)<thr);if(q){mergeNodes(f,q.id,id);UI.sel={kind:'node',id:q.id};return}
  for(const x of g.walls){if(x.w.a===id||x.w.b===id)continue;const t=(p.x-x.A.x)*x.u.x+(p.y-x.A.y)*x.u.y;if(t<1||t>x.L-1)continue;const qq={x:x.A.x+x.u.x*t,y:x.A.y+x.u.y*t};
    if(dist(qq,p)<Math.max(thr,x.h)){const nid=splitWall(f,x.w,t);mergeNodes(f,nid,id);UI.sel={kind:'node',id:nid};return}}}
svg.addEventListener('pointerdown',e=>{svg.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===2){if(drag?.moved&&!['pan','draw','meas'].includes(drag.type))commit();if(drag?.type==='draw'){UI.cur=null;render()}drag=null;pinchStart();return}if(ptrs.size>2)return;
  const t=e.target.closest('[data-kind]'),w=toWorld(e.clientX,e.clientY),f=floor();
  const base={sx:e.clientX,sy:e.clientY,moved:false};drag={...base,type:'pan',tx0:UI.vp.tx,ty0:UI.vp.ty,w};
  if(UI.measOn){const p=measSnap(w);drag={...base,type:'meas',a:p};UI.meas={a:p,b:p};return}
  if(UI.tool==='draw'&&UI.mode==='plan'){drag={...base,type:'draw'};UI.cur=snapDraw(w);render();return}
  if(!t)return;const k=t.dataset.kind,id=t.dataset.id;
  if(UI.mode==='elec'){if(UI.place)return;if(UI.assign&&k==='item'){const it=items(f).find(x=>x.id===id);if(it){assignCi(f,it,it.ci===UI.assign?null:UI.assign);drag=null;commit();renderPanel();render()}return}if(k==='item'){const it=items(f).find(x=>x.id===id);if(!it)return;UI.place=null;if(UI.sel?.id!==id)select({kind:'item',id});const p=itemPos(G(f,UI.view),it);drag={...base,type:'item',it,ox:w.x-p.x,oy:w.y-p.y}}
    else if(k==='room'){select({kind:'room',id})}return}
  if(k==='node'){select({kind:'node',id});const p=nodeOf(f,id);drag={...base,type:'node',id,ox:w.x-p.x,oy:w.y-p.y}}
  else if(k==='wall'){const x=f.walls.find(q=>q.id===id);select({kind:'wall',id});const A=nodeOf(f,x.a),B=nodeOf(f,x.b),L=wlen(f,x);
    const ids=[...new Set(lineOf(f,x).flatMap(c=>[c.a,c.b]))];drag={...base,type:'wall',p0:ids.map(i=>{const q=nodeOf(f,i);return {q,x:q.x,y:q.y}}),n:{x:-(B.y-A.y)/L,y:(B.x-A.x)/L},w0:w}}
  else if(k==='op'){const o=f.openings.find(x=>x.id===id);select({kind:'op',id});const x=f.walls.find(q=>q.id===o.wall),A=nodeOf(f,x.a),u=unitOf(f,x);drag={...base,type:'op',o,grab:(w.x-A.x)*u.x+(w.y-A.y)*u.y-o.off}}
  else if(k==='room'){const r=f.rooms.find(x=>x.id===id);select({kind:'room',id});drag={...base,type:'room',r,ox:w.x-r.x,oy:w.y-r.y,x0:r.x,y0:r.y}}});
svg.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId)){if(e.pointerType==='mouse'&&UI.tool==='draw'&&!UI.measOn&&UI.chain){UI.cur=snapDraw(toWorld(e.clientX,e.clientY));render()}return}
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pinch&&ptrs.size>=2){const [a,b]=[...ptrs.values()],d=Math.hypot(a.x-b.x,a.y-b.y),m={x:(a.x+b.x)/2,y:(a.y+b.y)/2},bx=svg.getBoundingClientRect(),v=UI.vp;
    v.s=clamp(pinch.s0*d/pinch.d,0.05,20);v.tx=m.x-bx.left-pinch.w.x*v.s;v.ty=m.y-bx.top-pinch.w.y*v.s;render();return}
  if(!drag)return;const w=toWorld(e.clientX,e.clientY);
  if(drag.type==='draw'){UI.cur=snapDraw(w);drag.moved=true;render();return}
  if(!drag.moved&&Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)<5)return;drag.moved=true;
  const f=floor(),gr=S.settings.snap?S.settings.grid:0;
  switch(drag.type){
    case 'pan':UI.vp.tx=drag.tx0+e.clientX-drag.sx;UI.vp.ty=drag.ty0+e.clientY-drag.sy;break;
    case 'meas':UI.meas={a:drag.a,b:measSnap(w,drag.a)};break;
    case 'node':{const p={x:w.x-drag.ox,y:w.y-drag.oy};snapNode(p,drag.id);const q=nodeOf(f,drag.id);q.x=r1(p.x);q.y=r1(p.y);break}
    case 'wall':{let t=(w.x-drag.w0.x)*drag.n.x+(w.y-drag.w0.y)*drag.n.y;if(gr)t=round(t,gr);for(const o of drag.p0){o.q.x=r1(o.x+drag.n.x*t);o.q.y=r1(o.y+drag.n.y*t)}break}
    case 'op':{const x=f.walls.find(q=>q.id===drag.o.wall);if(!x)break;const A=nodeOf(f,x.a),u=unitOf(f,x),L=wlen(f,x);let off=(w.x-A.x)*u.x+(w.y-A.y)*u.y-drag.grab;if(gr)off=round(off,gr);drag.o.off=clamp(off,0,L-drag.o.w);break}
    case 'room':drag.r.x=r1(w.x-drag.ox);drag.r.y=r1(w.y-drag.oy);break
    case 'item':{const it=drag.it,q={x:w.x-drag.ox,y:w.y-drag.oy};if(KINDS[it.k]?.place==='wall'){const sn=snapWall(G(f,UI.view),{x:w.x,y:w.y},Math.max(60,60/UI.vp.s));if(sn){it.wall=sn.wall;it.side=sn.side;it.off=gr?round(sn.off,gr):sn.off;const pp=comboPartner(f,it);if(pp){pp.wall=it.wall;pp.side=it.side;pp.off=it.off}}}else{let x=gr?round(q.x,gr):r1(q.x),y=gr?round(q.y,gr):r1(q.y);const A=alignGuides(f,null,it,{x,y},12/UI.vp.s);UI.guides={it,gx:A.gx,gy:A.gy};if(A.gx.length){x=A.gx[0].x;UI.guides.x=x}if(A.gy.length){y=A.gy[0].y;UI.guides.y=y}it.x=x;it.y=y}break}}
  render()});
function ptrEnd(e){if(!ptrs.has(e.pointerId))return;ptrs.delete(e.pointerId);
  if(pinch){if(ptrs.size<2)pinch=null;drag=null;return}
  if(!drag)return;const d=drag;drag=null;
  if(d.type==='meas'){if(!d.moved&&Math.hypot(e.clientX-d.sx,e.clientY-d.sy)<5)UI.meas=null;render();return}
  if(d.type==='draw'){if(e.type==='pointercancel'){UI.cur=null;render();return}const c=UI.cur||snapDraw(toWorld(e.clientX,e.clientY));drawTo(c);return}
  if(d.type==='pan'&&!d.moved&&UI.mode==='elec'&&UI.place){placeAt(d.w);return}
  if(d.type==='pan'&&!d.moved){const F=faceAt(G(floor(),UI.view),d.w),r=F&&floor().rooms.find(r=>inside(r,F.poly));select(r?{kind:'room',id:r.id}:null);return}
  UI.guides=null;
  if(!d.moved||d.type==='pan')return;
  if(d.type==='node')dropNode(d.id);
  if(d.type==='room'&&!faceAt(G(floor(),'soll'),d.r)){d.r.x=d.x0;d.r.y=d.y0}
  commit();validateSel();renderPanel();render()}
svg.addEventListener('pointerup',ptrEnd);svg.addEventListener('pointercancel',ptrEnd);
svg.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse'&&UI.tool==='draw'&&!ptrs.size){UI.cur=null;render()}});
